name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run contact unit tests
        run: npm run test:contact

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
